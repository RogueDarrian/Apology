<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Open your heart</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Caveat:wght@500&display=swap">
<style>
:root{--bg:#2a0f1c;--bg2:#4a1a2e;--heart:#e0475f;--paper:#fbf1e8;--ink:#3a1d27;--glow:rgba(224,71,95,.45);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0912;--bg2:#3a1424}}
:root[data-theme="dark"]{--bg:#1a0912;--bg2:#3a1424}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,var(--bg2),var(--bg) 70%);font-family:"Fraunces",Georgia,serif;color:var(--paper);overflow:hidden}
main{position:relative;width:min(92vw,440px);height:min(80vh,560px);display:grid;place-items:center}
.heart-btn{all:unset;cursor:pointer;display:grid;place-items:center;gap:1.5rem;text-align:center;transition:transform .7s cubic-bezier(.6,-.2,.3,1.2),opacity .5s .2s}
.heart-btn:focus-visible{outline:3px solid var(--paper);outline-offset:12px;border-radius:24px}
.heart{width:190px;height:170px;position:relative;filter:drop-shadow(0 0 30px var(--glow));animation:beat 1.6s ease-in-out infinite}
.heart svg{width:100%;height:100%;fill:var(--heart)}
.hint{font-style:italic;font-size:1.25rem;opacity:.85}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.1)}28%{transform:scale(1)}42%{transform:scale(1.07)}70%{transform:scale(1)}}
.letter{position:absolute;inset:0;margin:auto;width:100%;max-height:100%;overflow:auto;background:var(--paper);color:var(--ink);border-radius:6px;padding:2.2rem 2rem 2rem;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:scale(.2) rotate(-6deg);opacity:0;pointer-events:none;transition:transform .8s cubic-bezier(.2,1.1,.3,1),opacity .4s}
.letter h1{font-size:2rem;font-weight:500;font-style:italic;margin:0 0 1rem;color:#b3243d}
.letter p{font-family:"Caveat",cursive;font-size:1.55rem;line-height:1.35;margin:0 0 .8rem}
.sig{text-align:right;margin-top:1.4rem!important}
.open .heart-btn{transform:scale(.1) translateY(-200px);opacity:0;pointer-events:none}
.open .letter{transform:none;opacity:1;pointer-events:auto}
.fly{position:fixed;bottom:-30px;font-size:1.4rem;color:var(--heart);opacity:0;animation:rise 5s linear forwards;pointer-events:none}
@keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{animation:none}.fly{display:none}*{transition-duration:.01s!important}}
</style>
</head>
<body>
<main id="stage">
  <button class="heart-btn" id="btn" aria-label="Open the heart">
    <span class="heart"><svg viewBox="0 0 32 29" aria-hidden="true"><path d="M23.6 0c-3.4 0-5.7 1.8-7.6 4.4C14.100 1.800 11.800 0 8.400 0 3.700 0 0 3.700 0 8.400c0 8.900 9.500 14 16 20.600 6.500-6.600 16-11.700 16-20.600C32 3.700 28.300 0 23.600 0z"/></svg></span>
    <span class="hint">Tap the heart</span>
  </button>
  <article class="letter" aria-live="polite">
    <h1>To: My Baby</h1>
    <p>I, Darrian Saunders, am formally sorry to my baby Chloe for giving her fake news that she goes to school one day before she actually does.</p>
    <p>May she accept this apology, and I will try to be a better boyfriend ❤️</p>
    <p class="sig">Love,<br>Darrian</p>
  </article>
</main>
<script>
const stage=document.getElementById('stage');
document.getElementById('btn').addEventListener('click',()=>{
  stage.classList.add('open');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  for(let i=0;i<14;i++){
    const h=document.createElement('span');
    h.className='fly';h.textContent='♥';
    h.style.left=Math.random()*100+'vw';
    h.style.fontSize=(1+Math.random()*1.5)+'rem';
    h.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),7000);
  }
});
</script>
</body>
</html>
